        name: reconcile
        family: build
        owner: plugin-box
        triggers:
            - "`charly box reconcile` / cross-repo `@github` pin alignment / candy-version-mismatch cleanup"
validate-skill:
    skill:
        name: validate
        family: build
        owner: plugin-box
        triggers:
            - "`charly box validate` / schema error"

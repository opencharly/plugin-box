plugin-box:
    candy:
        description: |-
            The build-mode `charly box …` verb HANDLERS relocated into a COMPILED-IN command plugin
            candy (P15, K5). `charly box` is a SHARED command group whose subcommands have different
            owners: the core BoxCmd keeps only the grammar spine (a bare kong.Plugins holder, no
            retained verb) and candy/plugin-authoring contributes the authoring words, while THIS
            candy contributes twelve NESTED command providers under the `box` parent (each
            command:<word> with CommandParent()=="box"): generate, validate, new, pull, build,
            inspect, list, labels, load, merge, reconcile, feature.
            COMPILED-IN, each dispatches IN-PROC via Invoke(OpRun)
            (kong-parse its sub-grammar), so the handlers own charly's real stdio. `generate` renders
            the .build/ tree by InvokeProvider'ing the peer build:generate word (candy/plugin-build),
            which drives HostBuild("build-resolve", GenerateOnly); `new` (candy/project/box) calls the
            sdk/kit scaffold engine directly (kit.ScaffoldCandy/ScaffoldProject/AddBox), no core
            reentry; `validate` fetches the error-TOLERANT resolved-project envelope
            (HostBuild("validate-project")) and runs the whole per-kind/op rule engine + the deploykit
            resolution-graph checks IN-PLUGIN over it, merging the host's CUE-conformance / tunable /
            base⊻from diagnostics for the verdict; `load` streams a host image into a RUNNING pod
            venue's nested podman store over deploykit.TransferImageToVenue — the container twin of
            `charly vm cp-box`, needing no host reentry at all; `inspect` and `list` read the generic spec.ResolvedProject envelope
            (InvokeProvider("build","project")) — inspect's default JSON is snake_case canonical — with the
            deploy-overlay formats (inspect tunnel/bind_mounts) + store-live `list tags` reaching the
            hidden core __box-inspect-overlay / __box-list-tags reentries. Their data still needs the
            fully-resolved project / deploy overlay / podman store the plugin cannot compute pre-K1. It
            imports only the sdk module, never charly core. Placement-invisible (F8): the SAME provider
            compiles into charly or serves out-of-process.
        plugin:
            providers:
                - command:generate:box
                - command:validate:box
                - command:new:box
                - command:pull:box
                - command:build:box
                - command:inspect:box
                - command:list:box
                - command:labels:box
                - command:load:box
                - command:merge:box
                - command:reconcile:box
                - command:feature:box
            source: github.com/opencharly/plugin-box/candy/plugin-box
        plan:
            - # ADE check: a deterministic build-context check that does NOT depend on the host
              # reverse channel the box handlers need (the generate/validate words reach the host
              # in-proc, unavailable in a disposable `charly box feature run` container). It mirrors
              # candy/plugin-alias's pattern — a trivial build-context `command` (the built-in command
              # CHECK verb) running `true`. The full CLI end-to-end (`charly box generate/validate/
              # new`) is exercised by the live R10 + the Go tests.
              check: the box command plugin ships a buildable Go module (go.mod + the provider) the host can compile in; the full `charly box generate/validate/new` end-to-end is exercised by the live R10 + the Go tests
              id: box-module-present
              context:
                - build
              command: "true"

# ---------------------------------------------------------------------------
# The `charly box …` VERB skills — authored beside the handlers they document.
#
# Each is a ROUTING-ONLY node: `name`/`family`/`owner`, plus the `triggers:` that
# generate its DISPATCHER.md row WHERE THE SKILL IS ROUTED. Measured on these ten:
# five carry triggers (`build`, `generate`, `load`, `reconcile`, `validate`) and five
# carry none (`inspect`, `list`, `merge`, `new`, `pull`), so those five generate no
# row and this move adds and removes none for them. The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:` or
# `content:` — an inline body that disagrees with its file is a hard error in the
# marketplace generator (`candy/plugin-marketplace/skillfile.go`), and copying a
# body back into the node is how a skill drifts from its own file.
#
# `owner:` names THIS candy, because this candy IS the `command:*:box` provider
# these skills document. It composes no image — it is listed in the charly
# providers registry (`charly/charly/charly.yml`), never in a box's `candy:`
# chain — so these nodes add no entry to any `ai.opencharly.skill` OCI label;
# the bodies reach consumers through the generated marketplace corpus.
# ---------------------------------------------------------------------------
build-skill:
    skill:
        name: build
        family: build
        owner: plugin-box
        triggers:
            - "`charly box build` / `charly box generate` / Containerfile"
generate-skill:
    skill:
        name: generate
        family: build
        owner: plugin-box
        triggers:
            - "`charly box build` / `charly box generate` / Containerfile"
inspect-skill:
    skill:
        name: inspect
        family: build
        owner: plugin-box
list-skill:
    skill:
        name: list
        family: build
        owner: plugin-box
load-skill:
    skill:
        name: load
        family: build
        owner: plugin-box
        triggers:
            - "`charly box load` / delivering an image into a pod's NESTED podman store / nested-podman-socket / the container twin of `charly vm cp-box`"
merge-skill:
    skill:
        name: merge
        family: build
        owner: plugin-box
new-skill:
    skill:
        name: new
        family: build
        owner: plugin-box
pull-skill:

# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. This file told charly where to look and nothing else until the #24 wave:
# the capability rule below it needs a witness of its OWN, because the shared
# `check-commands` bed in opencharly/charly declares no `plugin.providers` entry in
# any fixture and so never executes that rule (#24). This file now declares TWO
# entities: `check-box-app`, the bare kind:local TEMPLATE, and `check-box-local`,
# the disposable witness built `from:` it.
discover:
    - path: candy
      recursive: true

# ---------------------------------------------------------------------------
# R10 witness: this plugin's OWN validate engine, driven through the real CLI.
#
# The shared `check-commands` bed in opencharly/charly cannot witness this
# plugin's capability rule: none of its fixtures declares a `plugin.providers`
# entry, so the rule never executes there (candy/plugin-box#24). The step
# `box-new-validate-generate` in that bed only proves the engine still ACCEPTS a
# good project. This bed drives the rule directly, on scratch projects, and
# asserts the diagnostic each fault gets — so it FAILS when the wording regresses.
#
# The steps run host-side against `${CHARLY_BIN}` (the binary under test, which
# compiles this plugin in). Each step writes its own scratch project under
# `mktemp -d` and removes it, so the bed leaves nothing behind.
# ---------------------------------------------------------------------------
check-box-app:
  local:
    description: >-
      Minimal kind:local TEMPLATE for the check-box member — a BARE `local:` node
      declaring no candy: the surface under test is this plugin's own validate
      engine, which charly compiles in, not a layer.
    candy: []

check-box-local:
  local:
    from: check-box-app
    host: local
    disposable: true
    lifecycle: dev
    description: >-
      Sole R10 witness of candy/plugin-box's validate engine — a disposable
      kind:local deploy on host: local. Each step writes a scratch project whose
      candy declares exactly one `plugin.providers` entry, runs
      `${CHARLY_BIN} box validate` in it, and asserts the diagnostic that entry
      gets. `box-capability-unknown-class` FAILS on the pre-fix engine, which
      answered a well-formed `<class>:<word>` pair whose class the pinned spec
      does not declare with "is malformed (want <class>:<word>)" — a false
      statement about a value whose grammar was already correct
      (candy/plugin-box#24). `box-capability-malformed` and
      `box-capability-accepted` hold the other two arms so a wording change
      cannot silently over-correct.
    plan:
      - check: >-
          the binary under test names itself and reports its own version, so the
          pasted run names the artifact that produced every assertion below
          (Standard 8)
        id: box-bed-binary
        exit_status: 0
        context:
          - runtime
        command:
          command: 'echo "CHARLY_BIN=${CHARLY_BIN}"; "${CHARLY_BIN}" version'
          in_container: false
      - check: >-
          a candy that declares a `plugin:` block with NO capability is reported as
          `plugin block declares no providers` — a GENUINELY violated capability, so
          this step goes red if that rule stops firing (candy/plugin-box#28). One of
          the two reachable capability violations an authored manifest can express
          (the other is an unknown provider class, witnessed by the step below).
        id: box-capability-no-providers
        exit_status: 0
        stdout:
          - contains: CAPABILITY-NO-PROVIDERS-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/x"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            PROJ
            cat > "$D/candy/x/charly.yml" <<'CANDY'
            x:
                candy:
                    description: fixture - a plugin block that genuinely violates the capability rule
                    plugin:
                        source: github.com/opencharly/x/candy/x
                        providers: []
                    plan:
                        - check: the fixture candy is loadable
                          id: fixture-ok
                          context:
                            - build
                          command: "true"
            CANDY
            OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1 || true)
            echo "$OUT" | grep -q 'plugin block declares no providers' || { echo 'FAIL: a plugin block with no capability was not reported'; echo "$OUT"; exit 1; }
            echo CAPABILITY-NO-PROVIDERS-OK
          in_container: false
      - check: >-
          a well-formed `<class>:<word>` pair whose class the closed vocabulary does not
          declare is reported as an UNKNOWN PROVIDER CLASS — naming the class and the set
          it was checked against — and is never called a grammar error (candy/plugin-box#24,
          #28). The fixture must name a class `#ProviderClassNames` OMITS: the former
          fixture used `workflow:lobster`, and `workflow` IS in that closed list, so the
          manifest declared a perfectly legal capability, the rule correctly reported
          nothing, and the step passed on a rule that had nothing to say. `zzznotaclass`
          is genuinely absent, and both gates report it (the CUE pattern AND this rule,
          since the engine validates an error-tolerant envelope) — so this step goes red
          if the rule's own wording is lost.
        id: box-capability-unknown-class
        exit_status: 0
        stdout:
          - contains: CAPABILITY-UNKNOWN-CLASS-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/x"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            PROJ
            cat > "$D/candy/x/charly.yml" <<'CANDY'
            x:
                candy:
                    description: fixture - a well-formed capability whose class the closed vocabulary omits
                    plugin:
                        source: github.com/opencharly/x/candy/x
                        providers:
                            - zzznotaclass:lobster
                    plan:
                        - check: the fixture candy is loadable
                          id: fixture-ok
                          context:
                            - build
                          command: "true"
            CANDY
            OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1 || true)
            echo "$OUT" | grep -q 'unknown provider class "zzznotaclass"' || { echo 'FAIL: the unknown-class wording is absent'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'known: ' || { echo 'FAIL: the known-class set is not enumerated'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'workflow' || { echo 'FAIL: the enumerated set no longer includes workflow'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'is malformed' && { echo 'FAIL: a well-formed pair is still called "is malformed"'; echo "$OUT"; exit 1; }
            echo CAPABILITY-UNKNOWN-CLASS-OK
          in_container: false
      - check: >-
          a `plugin_requires:` entry whose capability names an UNDECLARED class is reported
          by the SAME class-vocabulary rule as `providers:` — naming the class and the set
          it was checked against, and never calling a well-formed pair a grammar error.
          This is the arm the branch adds: nothing else in this bed evaluates a
          `plugin_requires` capability, so `box-capability-unknown-class` above (which
          declares `providers:` only) proves the rule for providers and would stay green
          even if the requires arm never fired. The fixture therefore declares a VALID
          provider AND an invalid requires class, so the only reachable fault is the
          requires one; and the CONTROL run — the same manifest with the `plugin_requires:`
          block removed — must NOT produce the diagnostic, so this step cannot pass
          vacuously on a rule that had nothing to say. The authored shape is
          `plugin: { requires: [ { capability: <class>:<word> } ] }` — STRUCT entries, and `plugin_requires`
          is the RESOLVED projection of it (`spec/schema/resolvedproject.cue:170`), not the authored key.
        id: box-capability-unknown-class-in-requires
        exit_status: 0
        stdout:
          - contains: CAPABILITY-REQUIRES-UNKNOWN-CLASS-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/x"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            PROJ
            cat > "$D/candy/x/charly.yml" <<'CANDY'
            x:
                candy:
                    description: fixture - a valid provider plus an UNKNOWN requires class (the arm this branch adds)
                    plugin:
                        source: github.com/opencharly/x/candy/x
                        providers:
                            - verb:lobster
                        requires:
                            - capability: zzznotaclass:lobster
                    plan:
                        - check: the fixture candy is loadable
                          id: fixture-ok
                          context:
                            - build
                          command: "true"
            CANDY
            OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1 || true)
            echo "$OUT" | grep -q 'unknown provider class "zzznotaclass"' || { echo 'FAIL: the requires arm did not report the unknown class'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'known: ' || { echo 'FAIL: the known-class set is not enumerated'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'workflow' || { echo 'FAIL: the enumerated set no longer includes workflow'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'is malformed' && { echo 'FAIL: a well-formed pair is still called "is malformed"'; echo "$OUT"; exit 1; }
            sed -i '/^ *requires:/,+1d' "$D/candy/x/charly.yml"
            CTL=$("${CHARLY_BIN}" -C "$D" box validate 2>&1 || true)
            echo "$CTL" | grep -q 'unknown provider class' && { echo 'FAIL: the control (no plugin_requires) still reports an unknown class - the diagnostic is not attributable to the requires arm'; echo "$CTL"; exit 1; }
            echo CAPABILITY-REQUIRES-UNKNOWN-CLASS-OK
          in_container: false
      - check: >-
          a genuine grammar error (a capability carrying no `<class>:` prefix) keeps
          the grammar message and does NOT claim an unknown class — the fault the
          pre-fix wording was correct for stays correct
        id: box-capability-malformed
        exit_status: 0
        stdout:
          - contains: CAPABILITY-MALFORMED-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/x"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            PROJ
            cat > "$D/candy/x/charly.yml" <<'CANDY'
            x:
                candy:
                    description: fixture - a capability with no `<class>:` prefix at all
                    plugin:
                        source: github.com/opencharly/x/candy/x
                        providers:
                            - workflow
                    plan:
                        - check: the fixture candy is loadable
                          id: fixture-ok
                          context:
                            - build
                          command: "true"
            CANDY
            OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1 || true)
            echo "$OUT" | grep -q 'is malformed (want <class>:<word>)' || { echo 'FAIL: the grammar wording is absent'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'unknown provider class' && { echo 'FAIL: a real grammar error now claims an unknown class'; echo "$OUT"; exit 1; }
            echo CAPABILITY-MALFORMED-OK
          in_container: false
      - check: >-
          a capability whose class the pinned spec DOES declare still validates clean
          with exit 0, so the fix rejects nothing it used to accept
        id: box-capability-accepted
        exit_status: 0
        stdout:
          - contains: CAPABILITY-ACCEPTED-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/x"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            PROJ
            cat > "$D/candy/x/charly.yml" <<'CANDY'
            x:
                candy:
                    description: fixture - a capability whose class the pinned spec declares
                    plugin:
                        source: github.com/opencharly/x/candy/x
                        providers:
                            - verb:x
                    plan:
                        - check: the fixture candy is loadable
                          id: fixture-ok
                          context:
                            - build
                          command: "true"
            CANDY
            OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1) || { echo 'FAIL: a declared class no longer validates'; echo "$OUT"; exit 1; }
            echo CAPABILITY-ACCEPTED-OK
          in_container: false
      - check: >-
          `charly box reconcile --closure` walks the project's WHOLE closure and REPORTS what it
          cannot repair (opencharly/charly#737). This step exercises the reporting leg on a ref the
          walk cannot fetch: an unfetchable ref's version is the one folded into the target from the
          same pin, so a skew comparison can never fire for it — the tool must say the closure is
          only PARTLY known and NAME the ref. FAILS if an unfetchable ref is swallowed (the pre-fix
          behaviour), because a half-known closure would then read as a fully-reconciled one.
        id: box-reconcile-closure-reports-unfetchable
        exit_status: 0
        stdout:
          - contains: BOX-CLOSURE-UNFETCHABLE-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/x"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            PROJ
            cat > "$D/candy/x/charly.yml" <<'CANDY'
            x:
                candy:
                    require:
                        - '@github.com/opencharly/this-repo-does-not-exist-zzz/candy/nope:v1.2.3'
                    plan:
                        - check: fixture
                          id: fixture-ok
                          context:
                              - build
                          command: "true"
            CANDY
            OUT=$("${CHARLY_BIN}" -C "$D" box reconcile --closure --dry-run 2>&1 || true)
            echo "$OUT" | grep -q 'could NOT be fetched' || { echo 'FAIL: the closure report does not say the closure is only partly known'; echo "$OUT"; exit 1; }
            echo "$OUT" | grep -q 'this-repo-does-not-exist-zzz@v1.2.3' || { echo 'FAIL: the report does not NAME the unfetchable ref'; echo "$OUT"; exit 1; }
            echo BOX-CLOSURE-UNFETCHABLE-OK
          in_container: false

      # ---------------------------------------------------------------------------
      # TUNABLES ARMS — the same instrument as the grammar arms above, with THIS
      # migration's retired spelling as its subject (opencharly/plugin-box#46: the
      # spec/sdk contract migration). An instrument travels; its subject does not.
      #
      # The rule under test is validateBuildTunables, whose message shape is MEASURED
      # at the module boundary (mutation M1 in the PR body produced exactly
      # `defaults: podman_jobs must be >= 0, got -1` before the rename, and
      # `defaults: stage_parallelism must be >= 0, got -1` after it). The CLI reachability
      # of that rule is what the FIRST run of this arm confirms — which is why the arm
      # asserts the message the rule produces rather than a message I expect it to.
      # ---------------------------------------------------------------------------
      - check: >-
          the MIGRATED build tunables, NEGATIVE arm: the retired key `podman_jobs` no longer
          produces the retired diagnostic — the rule reads the migrated key, not the old
          spelling (opencharly/plugin-box#46). WHAT THIS ARM DOES NOT CLAIM, because the run
          measured otherwise: the retired key is not REJECTED — an undeclared key under
          `defaults:` validates clean and is silently ignored (exit 0, `0 errors`), so an
          operator whose charly.yml still says `podman_jobs` loses the setting without a word.
          That is reported and FILED (opencharly/spec#241) rather than dressed as a rejection
          this arm does not witness.
        id: box-tunables-retired-key
        exit_status: 0
        stdout:
          - contains: BOX-TUNABLES-RETIRED-KEY-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            EV=".check/grammar-arms/box-tunables-retired-key.log"
            mkdir -p "$(dirname "$EV")"
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            defaults:
                podman_jobs: -1
            PROJ
            mkdir -p "$D/candy/x"
            {
              echo "binary under test: ${CHARLY_BIN}"
              echo "version: $("${CHARLY_BIN}" version 2>/dev/null | tail -1)"
              echo "invocation: box validate  (defaults.podman_jobs = -1, the RETIRED key)"
              set +e
              OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1)
              RC=$?
              set -e
              echo "exit: $RC"
              echo "--- output ---"
              echo "$OUT"
            } > "$EV" 2>&1 || { cat "$EV"; exit 1; }
            grep -q '^binary under test: ' "$EV" || { cat "$EV"; exit 1; }
            grep -qE '^version: .*2026\.[0-9]{3}\.[0-9]{4}' "$EV" || { echo 'FAIL: the binary under test reports no CalVer version, so it is not a valid instrument (R9)'; cat "$EV"; exit 1; }
            grep -q 'podman_jobs must be >= 0' "$EV" && { echo 'FAIL: the RETIRED diagnostic still fires - the rule still reads the retired key'; cat "$EV"; exit 1; }
            if grep -q 'WARNING' "$EV" && grep 'WARNING' "$EV" | grep -qv 'dev/worktree build'; then
              echo 'FAIL: a warning appeared that is not the known benign dev/worktree notice'; cat "$EV"; exit 1
            fi
            cat "$EV"
            echo BOX-TUNABLES-RETIRED-KEY-OK
          in_container: false
      - check: >-
          the MIGRATED build tunables, POSITIVE arm, same run: the MIGRATED key
          `stage_parallelism` IS the tunable, and the diagnostic names it — the message
          validateBuildTunables produces, measured at the module boundary by mutation M1.
        id: box-tunables-migrated-key
        exit_status: 0
        stdout:
          - contains: BOX-TUNABLES-MIGRATED-KEY-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            EV=".check/grammar-arms/box-tunables-migrated-key.log"
            mkdir -p "$(dirname "$EV")"
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true
            defaults:
                stage_parallelism: -1
            PROJ
            mkdir -p "$D/candy/x"
            {
              echo "binary under test: ${CHARLY_BIN}"
              echo "version: $("${CHARLY_BIN}" version 2>/dev/null | tail -1)"
              echo "invocation: box validate  (defaults.stage_parallelism = -1, the MIGRATED key)"
              set +e
              OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1)
              RC=$?
              set -e
              echo "exit: $RC"
              echo "--- output ---"
              echo "$OUT"
            } > "$EV" 2>&1 || { cat "$EV"; exit 1; }
            grep -q '^binary under test: ' "$EV" || { cat "$EV"; exit 1; }
            grep -qE '^version: .*2026\.[0-9]{3}\.[0-9]{4}' "$EV" || { echo 'FAIL: the binary under test reports no CalVer version, so it is not a valid instrument (R9)'; cat "$EV"; exit 1; }
            grep -q 'stage_parallelism must be >= 0' "$EV" || { echo 'FAIL: the migrated tunable was not validated by name - the rule did not run, or does not name the key the user can type'; cat "$EV"; exit 1; }
            if grep -q 'WARNING' "$EV" && grep 'WARNING' "$EV" | grep -qv 'dev/worktree build'; then
              echo 'FAIL: a warning appeared that is not the known benign dev/worktree notice'; cat "$EV"; exit 1
            fi
            cat "$EV"
            echo BOX-TUNABLES-MIGRATED-KEY-OK
          in_container: false

      # ---------------------------------------------------------------------------
      # THE IMAGE-OWNER SHAPE (opencharly/sdk#434, operator ruling): an image candy
      # (`base:` / `from:`) may not own a `skill:`. The node is re-homed onto a package
      # candy the image composes, and until it is, validate must say so LOUDLY and name
      # that fix. This is the product-boundary witness for validateSkillOwners.
      #
      # The control's body lives at the OWNING CANDY'S REPO ROOT, which for a candy inside
      # a project is the PROJECT ROOT — the layout every real skill owner uses (the candy
      # sits under `candy/`, its `.agents/skills/` at the repo root). The sdk's body
      # lookup resolves that root from the candy's source dir (deploykit/skills_collect.go
      # → candyRepoRoot) and looks there; it did NOT look beside the candy. MEASURED on
      # this tree: the SAME project with the body BESIDE the candy is REFUSED — "no
      # .agents/skills/psk1/SKILL.md exists at the repo root of the owning candy" — and
      # with the body at the project root it validates clean. The arm at the end of this
      # step pins that base, so the fixture's placement cannot drift back to a claim the
      # lookup does not make (opencharly/plugin-box#67).
      # ---------------------------------------------------------------------------
      - check: >-
          an IMAGE candy owning a `skill:` is REJECTED with the ruling's message — it names
          the node and the owner, says a `candy:` with `base:`/`from:` is an image with no
          source directory, names the fix verbatim, and cites opencharly/sdk#434. The
          fixture carries an IN-LINE `content:`, which is the arm that validated CLEAN
          (exit 0) before the rule: the shape is what is forbidden, not the missing body,
          so this step FAILS on the pre-fix engine. Its control — the SAME skill re-owned
          by the package candy the image composes, with its body at that candy's REPO ROOT
          (the project root here, where every real skill owner keeps `.agents/skills/`) —
          must validate clean, so the step cannot pass by rejecting everything.
        id: box-skill-image-owner
        exit_status: 0
        stdout:
          - contains: BOX-SKILL-IMAGE-OWNER-OK
        context:
          - runtime
        command:
          command: |-
            set -eu
            EV=".check/grammar-arms/box-skill-image-owner.log"
            mkdir -p "$(dirname "$EV")"
            # The log is TRUNCATED here, so every assertion below reads THIS run's output. Appended
            # to, the log keeps a previous run's lines, and an assertion like "exit: 0" can be
            # satisfied by an EARLIER run's output while this run's arm fails — a control that can
            # pass over a broken arm (measured: the arm below, with its body moved to the repo
            # root, passed against the log the green run had left behind).
            : > "$EV"
            D=$(mktemp -d)
            trap 'rm -rf "$D"' EXIT
            mkdir -p "$D/candy/pcandy"
            cat > "$D/charly.yml" <<'PROJ'
            discover:
                - path: candy
                  recursive: true

            pimage:
                candy:
                    base: docker.io/library/alpine:3.20
                    candy:
                        - pcandy
                    plan:
                        - check: fixture
                          id: fixture-ok
                          context:
                            - build
                          command: "true"

            psk1:
                skill:
                    family: test
                    owner: pimage
                    description: owned by the IMAGE - the shape the ruling forbids
                    content: |
                        Body prose owned by the image.
            PROJ
            cat > "$D/candy/pcandy/charly.yml" <<'CANDY'
            pcandy:
                candy:
                    description: the package candy the image composes
                    plan:
                        - run: no-op fixture step
                          command: "true"
                        - check: the fixture candy is loadable
                          id: fixture-ok
                          exit_status: 0
                          command: "true"
            CANDY
            {
              echo "binary under test: ${CHARLY_BIN}"
              echo "version: $("${CHARLY_BIN}" version 2>/dev/null | tail -1)"
              echo "invocation: box validate  (skill psk1 owned by image pimage, with in-line content)"
              set +e
              OUT=$("${CHARLY_BIN}" -C "$D" box validate 2>&1)
              RC=$?
              set -e
              echo "exit: $RC"
              echo "--- output ---"
              echo "$OUT"
            } > "$EV" 2>&1 || { cat "$EV"; exit 1; }
            grep -q '^binary under test: ' "$EV" || { cat "$EV"; exit 1; }
            grep -qE '^version: .*2026\.[0-9]{3}\.[0-9]{4}' "$EV" || { echo 'FAIL: the binary under test reports no CalVer version, so it is not a valid instrument (R9)'; cat "$EV"; exit 1; }
            grep -q '^exit: 1$' "$EV" || { echo 'FAIL: an image-owned skill validated clean - the shape is not rejected (opencharly/sdk#434)'; cat "$EV"; exit 1; }
            grep -q 'skill "psk1": owner "pimage" is an image, not a candy' "$EV" || { echo 'FAIL: the diagnostic does not name the node and the image owner'; cat "$EV"; exit 1; }
            grep -q 'carrying `base:` or `from:`' "$EV" || { echo 'FAIL: the diagnostic does not say what makes the owner an image'; cat "$EV"; exit 1; }
            grep -q 'no source directory' "$EV" || { echo 'FAIL: the diagnostic does not say an image has no source directory'; cat "$EV"; exit 1; }
            grep -qF 'move this skill to a package candy that the image composes, and set `owner:` to that candy' "$EV" || { echo 'FAIL: the diagnostic does not name the FIX'; cat "$EV"; exit 1; }
            grep -q 'opencharly/sdk#434' "$EV" || { echo 'FAIL: the diagnostic does not cite the ruling'; cat "$EV"; exit 1; }
            grep -q 'no SKILL.md exists under' "$EV" && { echo 'FAIL: the diagnostic still claims a file search that never ran'; cat "$EV"; exit 1; }
            # CONTROL: the ruling's own fix — the SAME skill owned by the package candy the image
            # composes, with NO in-line content and its body at that candy's REPO ROOT — must
            # validate CLEAN. A second scratch project, so the control proves the fixed SHAPE *and*
            # the body resolution the re-home relies on, not just that the first fixture was
            # rewritten. The body goes to the PROJECT ROOT because that is the owning candy's
            # repo root (sdk/deploykit/skills_collect.go → candyRepoRoot), and it is the layout
            # every real skill owner uses: the candy under `candy/`, its `.agents/skills/` at the
            # repo root. Beside the candy is NOT where the lookup looks.
            D2=$(mktemp -d)
            trap 'rm -rf "$D" "$D2"' EXIT
            mkdir -p "$D2/candy/pcandy" "$D2/.agents/skills/psk1"
            cat > "$D2/charly.yml" <<'PROJ2'
            discover:
                - path: candy
                  recursive: true

            pimage:
                candy:
                    base: docker.io/library/alpine:3.20
                    candy:
                        - pcandy
                    plan:
                        - check: fixture
                          id: fixture-ok
                          context:
                            - build
                          command: "true"

            psk1:
                skill:
                    family: test
                    owner: pcandy
                    description: owned by the package candy the image composes - the ruled fix
            PROJ2
            cp "$D/candy/pcandy/charly.yml" "$D2/candy/pcandy/charly.yml"
            printf -- '---\nname: psk1\ndescription: package-candy-owned skill\n---\n\nBody prose owned by the package candy.\n' \
              > "$D2/.agents/skills/psk1/SKILL.md"
            {
              echo "--- control: owner re-homed to the package candy pcandy, body at that candy's repo root ---"
              set +e
              CTL=$("${CHARLY_BIN}" -C "$D2" box validate 2>&1)
              CRC=$?
              set -e
              echo "exit: $CRC"
              echo "$CTL"
            } >> "$EV" 2>&1
            grep -q '^exit: 0$' "$EV" || { echo 'FAIL: the ruled FIX (a package-candy owner) does not validate clean'; cat "$EV"; exit 1; }
            if grep -q 'WARNING' "$EV" && grep 'WARNING' "$EV" | grep -qv 'dev/worktree build'; then
              echo 'FAIL: a warning appeared that is not the known benign dev/worktree notice'; cat "$EV"; exit 1
            fi
            # THE BASE, PINNED. The SAME project with the body BESIDE the candy — the placement
            # the lookup does NOT read — must be REFUSED, and the diagnostic must name the repo
            # root it looked in. This arm is what keeps the fixture's placement honest: a fixture
            # that put the body beside the candy would assert something the lookup does not do,
            # and the bed would be green over a false claim. Its own log is separate, because the
            # negative arm above also exits 1 and a shared log could satisfy either check.
            EV2=".check/grammar-arms/box-skill-body-base.log"
            mkdir -p "$(dirname "$EV2")"
            # TRUNCATED, like EV above: the assertions below must read THIS run's arm, never a
            # previous run's residue. Measured: appended to, the arm passed against the log the
            # green run had left behind while the arm's own placement was wrong.
            : > "$EV2"
            D3=$(mktemp -d)
            trap 'rm -rf "$D" "$D2" "$D3"' EXIT
            mkdir -p "$D3/candy/pcandy/.agents/skills/psk1"
            cp "$D2/charly.yml" "$D3/charly.yml"
            cp "$D/candy/pcandy/charly.yml" "$D3/candy/pcandy/charly.yml"
            printf -- '---\nname: psk1\ndescription: package-candy-owned skill\n---\n\nBody prose owned by the package candy.\n' \
              > "$D3/candy/pcandy/.agents/skills/psk1/SKILL.md"
            {
              echo "--- arm: the same body BESIDE the candy, not at that candy's repo root ---"
              set +e
              BES=$("${CHARLY_BIN}" -C "$D3" box validate 2>&1)
              BRC=$?
              set -e
              echo "exit: $BRC"
              echo "$BES"
            } >> "$EV2" 2>&1
            grep -q '^exit: 1$' "$EV2" || { echo 'FAIL: a body BESIDE the candy validated clean, so the lookup base is not the repo root'; cat "$EV2"; exit 1; }
            grep -q 'exists at the repo root of the owning candy' "$EV2" || { echo 'FAIL: the diagnostic does not name the repo root it looked in'; cat "$EV2"; exit 1; }
            cat "$EV2"
            cat "$EV"
            echo BOX-SKILL-IMAGE-OWNER-OK
          in_container: false
